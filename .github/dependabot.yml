version: 2
updates:

  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"

  # The apache org only permits action SHAs listed in
  # apache/infrastructure-actions/approved_patterns.yml. INFRA's allowlist
  # review lags an upstream release by roughly a week, and a PR opened before
  # the new SHA lands there gets startup_failure with no check attached to the
  # PR at all. The cooldown holds the bump until the allowlist has caught up.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 10

  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    target-branch: "mvnd-1.x"
    labels:
      - "backport"
      - "dependencies"
    # provisio 2.0.0 rejects duplicate archive entries, and every released
    # Maven 3 distribution carries one: lib/jansi-native is written twice as a
    # directory entry. Master is unaffected because it builds Maven 4, whose
    # distribution has neither. See apache/maven#12778.
    ignore:
      - dependency-name: "ca.vanzyl.provisio.maven.plugins:provisio-maven-plugin"
        versions: [ "[2.0.0,)" ]

  # Same allowlist cooldown as the master github-actions entry above.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    target-branch: "mvnd-1.x"
    labels:
      - "backport"
      - "dependencies"
    cooldown:
      default-days: 10
