name: Early Access

# trigger on push to branches and PR
on:
  push:
    branches:
      - master
      - mvnd-1.x
  pull_request:

env:
  JAVA_VERSION: '25'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  default-build:
    name: 'Default build (without GraalVM)'
    if: startsWith(github.event.head_commit.message, '[release] Release ') != true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: 'Prepare Mimir'
        shell: bash
        run: |
          mkdir -p ~/.mimir
          cp .github/ci-extensions.xml .mvn/extensions.xml
          cp .github/ci-mimir-daemon.properties ~/.mimir/daemon.properties

      - name: 'Restore Mimir caches'
        id: mimir-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.mimir/local
          key: mimir2-${{ runner.os }}-default-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            mimir2-${{ runner.os }}-default-
            mimir2-${{ runner.os }}-

      - name: 'Run default (non-native) build'
        run: ./mvnw verify -Dmrm=false -V -B -ntp -e -s .mvn/release-settings.xml

      - name: 'Upload daemon test logs'
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daemon-test-logs-default-build
          path: integration-tests/target/mvnd-tests/**/daemon*.log

      - name: 'Save Mimir caches'
        # pull requests and topic branches restore master's entry; their own saves could serve nobody else
        if: steps.mimir-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && (github.ref_name == github.event.repository.default_branch || endsWith(github.ref_name, '.x'))
        uses: actions/cache/save@v6
        with:
          path: ~/.mimir/local
          key: ${{ steps.mimir-cache.outputs.cache-primary-key }}

  native-build:
    name: 'Build with GraalVM on ${{ matrix.os }}'
    if: startsWith(github.event.head_commit.message, '[release] Release ') != true
    strategy:
      fail-fast: false
      matrix:
        # binaries wanted: linux amd64, mac M1, mac intel, windows x86
        os: [ ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2022 ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7

      - name: 'Set vars'
        shell: bash
        run: |
          ARCH=$(echo '${{ runner.arch }}' | awk '{print tolower($0)}')
          if [[ $ARCH == 'x64' ]]
          then
            echo "ARCH=amd64" >> $GITHUB_ENV
          elif [[ $ARCH == 'arm64' ]]
          then
            echo "ARCH=aarch64" >> $GITHUB_ENV
          else
            echo "ARCH=$ARCH" >> $GITHUB_ENV
          fi
          OS=$(echo '${{ runner.os }}' | awk '{print tolower($0)}')
          if [[ $OS == 'macos' ]]
          then
            echo "OS=darwin" >> $GITHUB_ENV
          else
            echo "OS=$OS" >> $GITHUB_ENV
          fi
          echo "VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: 'Set up GraalVM'
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1.6.7
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Prepare Mimir'
        shell: bash
        run: |
          mkdir -p ~/.mimir
          cp .github/ci-extensions.xml .mvn/extensions.xml
          cp .github/ci-mimir-daemon.properties ~/.mimir/daemon.properties

      - name: 'Restore Mimir caches'
        id: mimir-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.mimir/local
          key: mimir2-${{ runner.os }}-native-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            mimir2-${{ runner.os }}-native-
            mimir2-${{ runner.os }}-

      - name: 'Maven clean'
        run: ./mvnw clean -Dmrm=false -V -B -ntp -e

      - name: 'Patch AMD64 GraalVM libs for only requiring glibc 2.12'
        if: ${{ env.OS == 'linux' && env.ARCH == 'amd64' }}
        shell: bash
        run: |
          mkdir -p client/target/graalvm-libs-for-glibc-2.12

          : patch common libraries
          ( find "$GRAALVM_HOME/lib/static/linux-amd64/glibc" -name '*.a' 2>/dev/null
            find "$GRAALVM_HOME/lib/svm/clibraries/linux-amd64" -name '*.a' 2>/dev/null
            ls -1 /lib/x86_64-linux-gnu/libz.a 2>/dev/null
          ) | while IFS= read -r input; do
                output="client/target/graalvm-libs-for-glibc-2.12/$(basename -- "$input")"
                objcopy --redefine-syms=client/src/main/resources/glibc/glibc.redef -- "$input" "$output" 2>/dev/null
              done

          : compile stat backward-compat shim for glibc before 2.33
          gcc -O3 -Os -Wall -Wextra -Werror -c -o client/target/stat-compat.o client/src/main/resources/glibc/stat-compat.c

          : patch gcc startfile
          gcc -O3 -Os -Wall -Wextra -Werror -Wconversion -Wsign-conversion -Wcast-qual -pedantic -c -o client/target/dynamic-libc-start.o client/src/main/resources/glibc/dynamic-libc-start.c
          ld -r /lib/x86_64-linux-gnu/Scrt1.o client/target/dynamic-libc-start.o client/target/stat-compat.o -o client/target/graalvm-libs-for-glibc-2.12/Scrt1.o
          objcopy --redefine-syms=client/src/main/resources/glibc/glibc.redef client/target/graalvm-libs-for-glibc-2.12/Scrt1.o 2>/dev/null

      - name: 'Patch ARM64 GraalVM libs for only requiring glibc 2.17'
        if: ${{ env.OS == 'linux' && env.ARCH == 'aarch64' }}
        shell: bash
        run: |
          mkdir -p client/target/graalvm-libs-for-glibc-2.17

          : patch common libraries
          ( find "$GRAALVM_HOME/lib/static/linux-aarch64/glibc" -name '*.a' 2>/dev/null
            find "$GRAALVM_HOME/lib/svm/clibraries/linux-aarch64" -name '*.a' 2>/dev/null
            ls -1 /lib/aarch64-linux-gnu/libz.a 2>/dev/null
          ) | while IFS= read -r input; do
                output="client/target/graalvm-libs-for-glibc-2.17/$(basename -- "$input")"
                objcopy --redefine-syms=client/src/main/resources/glibc/glibc.redef.aarch64 -- "$input" "$output" 2>/dev/null
              done

          : compile stat backward-compat shim for glibc before 2.33
          gcc -O3 -Os -Wall -Wextra -Werror -c -o client/target/stat-compat.o client/src/main/resources/glibc/stat-compat.c

          : patch gcc startfile
          gcc -O3 -Os -Wall -Wextra -Werror -Wconversion -Wsign-conversion -Wcast-qual -pedantic -c -o client/target/dynamic-libc-start.o client/src/main/resources/glibc/dynamic-libc-start.c
          ld -r /lib/aarch64-linux-gnu/Scrt1.o client/target/dynamic-libc-start.o client/target/stat-compat.o -o client/target/graalvm-libs-for-glibc-2.17/Scrt1.o
          objcopy --redefine-syms=client/src/main/resources/glibc/glibc.redef.aarch64 client/target/graalvm-libs-for-glibc-2.17/Scrt1.o 2>/dev/null

      - name: 'Build native distribution'
        run: ./mvnw verify -Pnative -Dmrm=false -V -B -ntp -e -s .mvn/release-settings.xml

      - name: 'Verify AMD64 native binary for only requiring glibc 2.12'
        if: ${{ env.OS == 'linux' && env.ARCH == 'amd64' }}
        shell: bash
        run: |
          ldd client/target/mvnd
          err=0
          objdump -T client/target/mvnd | grep GLIBC_ | grep -v 'GLIBC_\([01]\|2\.[0-9]\|2\.1[012]\)[^0-9]' || err=$?
          (( err == 1 ))

      - name: 'Verify ARM64 native binary for only requiring glibc 2.17'
        if: ${{ env.OS == 'linux' && env.ARCH == 'aarch64' }}
        shell: bash
        run: |
          ldd client/target/mvnd
          err=0
          objdump -T client/target/mvnd | grep GLIBC_ | grep -v 'GLIBC_\([01]\|2\.[0-9]\|2\.1[0-7]\)[^0-9]' || err=$?
          (( err == 1 ))

      - name: 'Verify Windows native binary does not require the Visual C++ redistributable'
        if: ${{ env.OS == 'windows' }}
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          $deps = & $dumpbin /nologo /dependents client\target\mvnd.exe
          $deps
          if ($deps -match '^\s*(vcruntime|msvcp)\d') { throw 'mvnd.exe must not depend on the Visual C++ redistributable' }

      - name: 'Upload daemon test logs'
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daemon-test-logs-${{ env.OS }}-${{ env.ARCH }}
          path: integration-tests/target/mvnd-tests/**/daemon*.log

      - name: 'Upload artifact'
        uses: actions/upload-artifact@v7
        with:
          name: mvnd-${{ env.OS }}-${{ env.ARCH }}
          path: dist/target/maven-mvnd-*.zip

      - name: 'Save Mimir caches'
        # pull requests and topic branches restore master's entry; their own saves could serve nobody else
        if: steps.mimir-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && (github.ref_name == github.event.repository.default_branch || endsWith(github.ref_name, '.x'))
        uses: actions/cache/save@v6
        with:
          path: ~/.mimir/local
          key: ${{ steps.mimir-cache.outputs.cache-primary-key }}

  prune-caches:
    name: 'Prune superseded Mimir caches'
    # every POM change saves a new generation; restores only use the exact key or the newest fallback
    needs: [default-build, native-build]
    if: ${{ !cancelled() && github.event_name == 'push' && (github.ref_name == github.event.repository.default_branch || endsWith(github.ref_name, '.x')) }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: 'Delete all but the newest cache of each family on this branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key mimir2- --limit 100 --json id,key,createdAt \
            --jq 'group_by(.key | sub("-[0-9a-f]{64}$"; "")) | .[] | sort_by(.createdAt) | .[:-1][] | "\(.id) \(.key)"' |
          while read -r id key; do
            echo "Deleting $key"
            gh cache delete "$id" --repo "$GITHUB_REPOSITORY"
          done
